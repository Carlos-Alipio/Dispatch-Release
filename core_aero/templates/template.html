{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit Dispatch Release - MapLibre</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MapLibre GL JS (JS + CSS) -->
    <link href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
    </style>
</head>

<body class="bg-slate-900 h-screen flex flex-col font-sans">

    <!-- Painel UI Flutuante de Planejamento Tático -->
    <div
        class="absolute top-4 left-4 z-10 w-96 bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 text-slate-200">
        <div class="flex items-center space-x-3 mb-6">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                </path>
            </svg>
            <h1 class="text-xl font-bold text-white">Planejamento Tático</h1>
        </div>

        <form id="routeForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Origem (ICAO)</label>
                    <input type="text" id="origem"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white uppercase focus:outline-none focus:border-blue-500"
                        placeholder="Ex: SBBR">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Destino (ICAO)</label>
                    <input type="text" id="destino"
                        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white uppercase focus:outline-none focus:border-blue-500"
                        placeholder="Ex: SBSP">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Rota (Aerovias e Fixos)</label>
                <textarea id="route_string" rows="3"
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white uppercase focus:outline-none focus:border-blue-500"
                    placeholder="OBLAX UZ21 VUNOX" required></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nível de Voo Inicial</label>
                <input type="number" id="initial_level" value="350" step="10"
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg shadow-lg flex justify-center items-center space-x-2 transition-colors">
                <span>Plotar Rota</span>
            </button>

            <div id="statusMessage" class="text-xs text-red-400 mt-2 hidden"></div>
        </form>
    </div>

    <!-- Filtro de Aerovias -->
    <div
        class="absolute bottom-6 right-6 z-10 bg-slate-800 p-2 rounded-xl shadow-2xl border border-slate-700 flex space-x-2">
        <button id="btn-awys-hi"
            class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 px-4 rounded transition-colors border border-slate-600">Alta
            (HI)</button>
        <button id="btn-awys-lo"
            class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 px-4 rounded transition-colors border border-slate-600">Baixa
            (LO)</button>
        <button id="btn-awys-both"
            class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded transition-colors shadow-lg">Ambas</button>
    </div>

    <!-- Controle de Camadas (Layers) -->
    <div
        class="absolute top-6 right-6 z-10 bg-slate-800 p-4 rounded-xl shadow-2xl border border-slate-700 text-white text-sm w-52">
        <h3 class="font-bold mb-3 border-b border-slate-600 pb-2">Camadas do Mapa</h3>
        <div class="flex flex-col space-y-2">
            <label class="flex items-center space-x-2 cursor-pointer border-b border-slate-600 pb-2 mb-2">
                <input type="checkbox" id="toggle-nuvens"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">Nuvens (Meteorologia)</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-firs"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">FIRs / UIRs</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-restritas"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">Áreas Restritas</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-aerovias"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">Aerovias</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-aeroportos"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">Aeroportos</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-vors"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">VORs</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-ndbs"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">NDBs</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="toggle-fixos"
                    class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-500 focus:ring-offset-slate-800"
                    checked>
                <span class="text-slate-300 hover:text-white transition-colors">Fixos / Waypoints</span>
            </label>
        </div>
    </div>

    <!-- Container do Mapa WebGL -->
    <main class="flex-grow relative">
        <div id="map" class="absolute inset-0 w-full h-full"></div>
    </main>

    <!--
        Ponte de configuração: o único ponto onde o Django "conversa" com o JS.
        Valores vindos do ambiente (.env -> settings) são injetados aqui;
        o cockpit.js (estático, sem processamento) lê tudo de window.COCKPIT_CONFIG.
    -->
    <script>
        window.COCKPIT_CONFIG = {
            owmApiKey: "{{ owm_api_key }}"
        };
    </script>
    <script src="{% static 'core_aero/js/cockpit.js' %}"></script>
</body>

</html>

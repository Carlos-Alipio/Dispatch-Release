name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # Os testes que dependem do banco AIRAC (fora do git) são pulados
      # automaticamente via skipif; aqui rodam os de domínio e de API.
      - name: Rodar testes
        run: pytest -v
        env:
          DJANGO_SECRET_KEY: chave-somente-para-ci
          DJANGO_DEBUG: "True"
